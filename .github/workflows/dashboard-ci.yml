name: Dashboard CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dashboard
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies (npm ci)
        if: ${{ hashFiles('dashboard/package-lock.json') != '' }}
        run: npm ci

      - name: Install dependencies (npm install fallback)
        if: ${{ hashFiles('dashboard/package-lock.json') == '' }}
        run: npm install

      - name: Build
        run: npm run build
